<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El quiz único</title>
    <link rel="shortcut icon" href="./assets/gameboy.png" type="image/x-icon">
    <!--charlist import-->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/chartist.js/latest/chartist.min.css">
    <script src="//cdn.jsdelivr.net/chartist.js/latest/chartist.min.js"></script>
    <!--our styles-->
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <nav>
        <ul id="nav-bar">
            <li><a href="#" id="home-btn">HOME</a></li>
            <li><a href="#" id="ranking-btn">RANKINGS</a></li>
        </ul>
    </nav>

    <main>
        <section id="landing-screen">
            <h2>¡Bienvenidos JapanWekend 2024!</h2>
            <p>¿Sabes más que la persona a tu lado? Compruébalo en solo 10 preguntas. <br> <br> No olvides poner tu nick al terminar</p>
            <form id="quiz-options-form">
                <fieldset>
                    <label for="difficulty">Dificultad:</label>
                    <select class="formOption" id="difficulty" name="difficulty">
                        <option value="easy">Fácil</option>
                        <option value="medium">Medio</option>
                        <option value="hard">Difícil</option>
                    </select>
                </fieldset>
                <Fieldset>
                    <label for="category">Temática:</label>
                    <select id="category" class="formOption" name="category">
                        <option value="31">Anime</option>
                        <option value="15">Videojuegos</option>
                    </select>
                </Fieldset>
            </form>
            <button class="quiz-start-btn pixel2">¡Comienza el quiz!</button>
            <div id="spinner-container" style="display: none;">
                <div id="spinner"></div>
                <p id="loadingTips">Generando</p>
            </div>
        </section>

        <section id="login-popup" hidden>
            <article id="login">
                <form id="login-form">
                    <h3>GUARDAR PUNTUACION</h3>

                    <label for="nick">Email: </label>
                    <input type="text" id="nick" name="nick" class="login-input">
                    <p class="msg"></p>
                    <p class="msgerr"></p>
                    <button type="submit" class="pixel2">Enviar</button>
                </form>
            </article>
        </section>

        <section id="quiz-screen" hidden>
        </section>

        <section id="results-screen" hidden>
        </section>

        <section id="ranking-screen" hidden>
        </section>

        <section id="barchart-screen" hidden>
            <p id="cerrar-barras" class="cerrar-ventana">X</p>
        </section>
    </main>

    <!--our js-->
    <script src="./scripts/script.js" type="module"></script>

</body>

</html>
